name: Sync dist to aweb

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-aweb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-aweb
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish dist to aweb
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.AWEB_TOKEN }}
          external_repository: Plana-EpicTankCommander/aweb
          publish_branch: main
          publish_dir: ./dist
          keep_files: README.md,.gitattributes
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: dist from webfilesproject@${{ github.sha }}"
