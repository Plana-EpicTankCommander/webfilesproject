name: Deploy to aweb (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-aweb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish dist to aweb
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.AWEB_TOKEN }}
          external_repository: Plana-EpicTankCommander/aweb
          publish_branch: main
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
